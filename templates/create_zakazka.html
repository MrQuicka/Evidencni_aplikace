{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h4>Vytvořit novou zakázku</h4>
                </div>
                <div class="card-body">
                    <form method="post">
                        <div class="mb-3">
                            <label for="name" class="form-label">Název zakázky *</label>
                            <input type="text" class="form-control" id="name" name="name"
                                   placeholder="např. Zákazník XYZ" required>
                            <div class="form-text">Tento název bude použit pro skupinu projektů.</div>
                        </div>

                        <div class="mb-3">
                            <label for="color" class="form-label">Barva</label>
                            <input type="color" class="form-control form-control-color" id="color" name="color"
                                   value="#0d6efd" title="Vyberte barvu pro zakázku">
                            <div class="form-text">Barva pro snadné rozlišení zakázek.</div>
                        </div>

                        <div class="alert alert-info">
                            <i class="bi bi-info-circle"></i>
                            Při vytvoření zakázky se automaticky vytvoří výchozí projekt
                            <strong>"[Název zakázky] - Všeobecné práce"</strong>.
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a href="{{ url_for('zakazky') }}" class="btn btn-secondary">Zrušit</a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-plus-circle"></i> Vytvořit zakázku
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
