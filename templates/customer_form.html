{% extends "base.html" %}
{% block title %}{{ 'Upravit odběratele' if customer else 'Nový odběratel' }}{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2><i class="bi bi-person-plus"></i> {{ 'Upravit odběratele' if customer else 'Nový odběratel' }}</h2>

    <form method="POST">
        <div class="row">
            <div class="col-md-6">
                <div class="card mb-3">
                    <div class="card-header"><h5>Firemní údaje</h5></div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="company_name" class="form-label">Název firmy / Jméno *</label>
                            <input type="text" class="form-control" id="company_name" name="company_name"
                                   value="{{ customer.company_name if customer else '' }}" required>
                        </div>
                        <div class="mb-3">
                            <label for="street" class="form-label">Ulice a číslo</label>
                            <input type="text" class="form-control" id="street" name="street"
                                   value="{{ customer.street if customer else '' }}">
                        </div>
                        <div class="row">
                            <div class="col-4 mb-3">
                                <label for="zip_code" class="form-label">PSČ</label>
                                <input type="text" class="form-control" id="zip_code" name="zip_code"
                                       value="{{ customer.zip_code if customer else '' }}">
                            </div>
                            <div class="col-8 mb-3">
                                <label for="city" class="form-label">Město</label>
                                <input type="text" class="form-control" id="city" name="city"
                                       value="{{ customer.city if customer else '' }}">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="country" class="form-label">Země</label>
                            <input type="text" class="form-control" id="country" name="country"
                                   value="{{ customer.country if customer else 'Česká republika' }}">
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label for="ic" class="form-label">IČ</label>
                                <input type="text" class="form-control" id="ic" name="ic"
                                       value="{{ customer.ic if customer else '' }}">
                            </div>
                            <div class="col-6 mb-3">
                                <label for="dic" class="form-label">DIČ</label>
                                <input type="text" class="form-control" id="dic" name="dic"
                                       value="{{ customer.dic if customer else '' }}">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card mb-3">
                    <div class="card-header"><h5>Kontakt a poznámky</h5></div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="email" class="form-label">E-mail</label>
                            <input type="email" class="form-control" id="email" name="email"
                                   value="{{ customer.email if customer else '' }}">
                        </div>
                        <div class="mb-3">
                            <label for="phone" class="form-label">Telefon</label>
                            <input type="text" class="form-control" id="phone" name="phone"
                                   value="{{ customer.phone if customer else '' }}">
                        </div>
                        <div class="mb-3">
                            <label for="note" class="form-label">Poznámka</label>
                            <textarea class="form-control" id="note" name="note" rows="3"
                            >{{ customer.note if customer else '' }}</textarea>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-3 mb-4">
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-check-lg"></i> {{ 'Uložit změny' if customer else 'Vytvořit odběratele' }}
            </button>
            <a href="{{ url_for('faktury.customers') }}" class="btn btn-secondary">Zrušit</a>
        </div>
    </form>
</div>
{% endblock %}
