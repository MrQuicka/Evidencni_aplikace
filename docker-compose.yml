version: '3.8'

services:
  # MySQL databáze
  db:
    image: mysql:8.0
    container_name: dochazka_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: dochazka
      MYSQL_USER: dochazka_user
      MYSQL_PASSWORD: dochazka_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - dochazka_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Flask backend aplikace
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dochazka_web
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      SQLALCHEMY_DATABASE_URI: mysql+pymysql://dochazka_user:dochazka_pass@db:3306/dochazka
      FLASK_ENV: development
      FLASK_DEBUG: 1
    volumes:
      # Pro development - mount zdrojového kódu pro live reload
      - .:/app
      # Prevence přepsání node_modules a __pycache__
      - /app/__pycache__
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dochazka_network
    command: python app.py

volumes:
  mysql_data:
    driver: local

networks:
  dochazka_network:
    driver: bridge
